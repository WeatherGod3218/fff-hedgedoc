services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  proxy:
    build:
        context: .
        dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env.proxy
    environment:
      - DEV_MODE=false

  hedgedoc:
    # Make sure to use the latest release from https://hedgedoc.org/latest-release, no actually fix your shit first please
    image: quay.io/hedgedoc/hedgedoc:1.12.0
    env_file:
      - .env.hedgedoc
    volumes:
      - uploads:/hedgedoc/public/uploads
    restart: always

volumes:
  database:
  uploads: